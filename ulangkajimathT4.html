    window.processTeacherLogin = async () => {
        const email = document.getElementById('t-email').value.trim();
        if (!email) {
            showModal("Ralat", "Sila masukkan e-mel anda.");
            return;
        }
        State.teacher.email = email;
        
        if (!isFirebaseReady || !auth.currentUser) {
            showModal("Amaran Pangkalan Data", "Sistem pangkalan data tidak dapat disambungkan ketika ini. Harap maklum.");
            return;
        }

        contentDiv.innerHTML = `<div class="text-school-blue flex flex-col items-center"><i class="fas fa-spinner fa-spin fa-3x mb-4"></i><p>Mengambil data markah...</p></div>`;
        
        try {
            // Mandate: Use /artifacts/{appId}/public/data/scores
            // Fetch all, filter in memory
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'math_scores');
            const snapshot = await getDocs(q);
            let results = [];
            
            snapshot.forEach((doc) => {
                let data = doc.data();
                if(data.teacherEmail && data.teacherEmail.toLowerCase() === email.toLowerCase()) {
                    results.push(data);
                }
            });
            
            // Sort by timestamp descending
            results.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderTeacherDashboard(results);
            
        } catch (error) {
            console.error("Fetch error:", error);
            showModal("Ralat", "Gagal mengambil data markah murid.");
            renderTeacherLogin();
        }
    };

                        <td class="p-3">${r.studentName}</td>
                        <td class="p-3">${r.className}</td>
                        <td class="p-3 font-bold text-school-blue">Lvl ${r.level} (${r.score}/3)</td>

                    </button>
                    <button onclick="window.startLevel(2)" class="w-full bg-yellow-500 text-white p-4 rounded-xl font-bold text-lg btn-hover-effect flex items-center justify-between shadow-md">
                        <span><i class="fas fa-star text-yellow-100 mr-1"></i><i class="fas fa-star text-yellow-100 mr-2"></i> Level 2: Sederhana (30 Soalan)</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <button onclick="window.startLevel(3)" class="w-full bg-red-500 text-white p-4 rounded-xl font-bold text-lg btn-hover-effect flex items-center justify-between shadow-md">
                        <span><i class="fas fa-fire text-yellow-300 mr-2"></i> Level 3: KBAT (30 Soalan)</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <div class="mt-6 text-sm text-gray-500 border-t pt-4">
                    <p><i class="fas fa-info-circle"></i> Setiap level mengandungi 3 soalan untuk 10 Bab Matematik KSSM Tingkatan 4.</p>
                </div>
            </div>
        `;
    }

    window.startLevel = (level) => {
        State.currentLevel = level;
        State.currentTopicIndex = 0;
        State.currentQIndex = 0;
        State.score = 0;
        State.topicScore = 0;
        renderTopicTransition();
    };

    function renderTopicTransition() {
        const topicName = State.topics[State.currentTopicIndex];
        
        contentDiv.innerHTML = `
            <div class="w-full max-w-sm fade-in text-center flex flex-col items-center justify-center min-h-[300px]">
                <i class="fas fa-book-open fa-3x text-school-blue mb-6"></i>
                <h3 class="text-xl text-gray-500 font-semibold mb-2">Seterusnya...</h3>
                <h2 class="text-3xl font-bold text-gray-800 mb-8">${topicName}</h2>
                <div class="w-16 h-1 bg-school-gold rounded-full mb-8"></div>
                <button onclick="window.renderGameplay()" class="w-full bg-school-blue text-white p-4 rounded-xl font-bold text-lg btn-hover-effect">
                    Mula Bab Ini <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        `;
    }

    window.renderGameplay = function() {
        State.isAnswered = false;
        
        // Akses data soalan: Level -> Bab -> Soalan
        const topicData = QuizData[State.currentLevel][State.currentTopicIndex];
        const qData = topicData[State.currentQIndex];
        const totalQInTopic = topicData.length;
        
        const lvlColors = {1: 'bg-green-100 text-green-800', 2: 'bg-yellow-100 text-yellow-800', 3: 'bg-red-100 text-red-800'};
        const lvlNames = {1: 'Senang', 2: 'Sederhana', 3: 'KBAT'};

        let optionsHTML = '';
        const labels = ['A', 'B', 'C', 'D'];
        qData.options.forEach((opt, idx) => {
            optionsHTML += `
                <button id="opt-${idx}" onclick="window.checkAnswer(${idx})" class="option-btn w-full text-left p-4 rounded-lg bg-gray-50 mb-3 text-gray-800 flex items-start gap-3 shadow-sm">
                    <span class="font-bold bg-white border border-gray-300 rounded w-8 h-8 flex items-center justify-center shrink-0 shadow-sm">${labels[idx]}</span>
                    <span class="mt-1">${opt}</span>
                </button>
            `;
        });

        // Kira soalan keseluruhan (cth: Soalan 4 / 30)
        const overallQNumber = (State.currentTopicIndex * 3) + State.currentQIndex + 1;
        const totalOverallQ = State.topics.length * 3; // 10 bab x 3 soalan = 30

        contentDiv.innerHTML = `
            <div class="w-full max-w-2xl fade-in flex flex-col h-full">
                <!-- Status Bar -->
                <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${lvlColors[State.currentLevel]} shadow-sm">Level ${State.currentLevel}: ${lvlNames[State.currentLevel]}</span>
                    <span class="text-sm font-bold text-school-blue bg-blue-50 px-3 py-1 rounded-full border border-blue-100">Jum. Soalan: ${overallQNumber} / ${totalOverallQ}</span>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-2 mb-6">
                    <div class="bg-school-gold h-2 rounded-full transition-all duration-500" style="width: ${(overallQNumber / totalOverallQ) * 100}%"></div>
                </div>
                
                <!-- Topik & Soalan -->
                <div class="mb-6 bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                    <p class="text-xs text-school-blue font-bold uppercase tracking-wider mb-3"><i class="fas fa-tag mr-1"></i> ${State.topics[State.currentTopicIndex]}</p>
                    <h3 class="text-xl font-semibold text-gray-800 leading-relaxed">${qData.question}</h3>
                </div>
                
                <!-- Pilihan Jawapan -->
                <div id="options-container" class="mb-2">
                    ${optionsHTML}
                </div>
                
                <!-- Kawasan Penyelesaian (Sembunyi by default) -->
                <div id="solution-container" class="hidden mt-auto bg-blue-50 p-5 rounded-xl border border-blue-200 shadow-inner mb-4">
                    <h4 class="font-bold text-school-blue mb-2 flex items-center"><i class="fas fa-lightbulb text-yellow-500 mr-2 fa-lg"></i> Langkah Penyelesaian:</h4>
                    <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap" id="solution-text"></p>
                </div>

                <!-- Butang Seterusnya -->
                <button id="next-btn" onclick="window.nextQuestion()" class="hidden w-full bg-school-blue text-white p-4 rounded-xl font-bold text-lg btn-hover-effect mt-4 shadow-md">
                    Teruskan <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        `;
    }

    window.checkAnswer = (selectedIndex) => {
        if (State.isAnswered) return;
        State.isAnswered = true;
        
        const topicData = QuizData[State.currentLevel][State.currentTopicIndex];
        const qData = topicData[State.currentQIndex];
        const correctIndex = qData.answerIndex;
        
        // Disable all buttons
        for(let i=0; i<4; i++) {
            const btn = document.getElementById(`opt-${i}`);
            if(btn) {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            }
        }

        // Highlight Jawapan
        const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
        const correctBtn = document.getElementById(`opt-${correctIndex}`);
        
        if (selectedIndex === correctIndex) {
            State.score++;
            State.topicScore++;
            selectedBtn.classList.remove('bg-gray-50', 'opacity-70');
            selectedBtn.classList.add('option-correct', 'opacity-100', 'shadow-md');
            selectedBtn.innerHTML = `<span class="font-bold bg-green-200 border-green-500 text-green-800 rounded w-8 h-8 flex items-center justify-center shrink-0 shadow-sm"><i class="fas fa-check"></i></span><span class="mt-1">${qData.options[selectedIndex]}</span>`;
        } else {
            selectedBtn.classList.remove('bg-gray-50', 'opacity-70');
            selectedBtn.classList.add('option-wrong', 'opacity-100', 'shadow-md');
            selectedBtn.innerHTML = `<span class="font-bold bg-red-200 border-red-500 text-red-800 rounded w-8 h-8 flex items-center justify-center shrink-0 shadow-sm"><i class="fas fa-times"></i></span><span class="mt-1">${qData.options[selectedIndex]}</span>`;
            
            // Show correct answer visually too
            correctBtn.classList.remove('bg-gray-50', 'opacity-70');
            correctBtn.classList.add('option-correct', 'opacity-100', 'ring-2', 'ring-green-500');
        }

        // Tunjuk Penyelesaian
        const solContainer = document.getElementById('solution-container');
        document.getElementById('solution-text').innerHTML = qData.solution;
        solContainer.classList.remove('hidden');
        solContainer.classList.add('fade-in');

        // Semak jika soalan terakhir untuk bab ini, ubah teks butang
        const nextBtn = document.getElementById('next-btn');
        const isLastQInTopic = State.currentQIndex === topicData.length - 1;
        const isLastTopic = State.currentTopicIndex === State.topics.length - 1;
        
        if (isLastQInTopic && isLastTopic) {
             nextBtn.innerHTML = `Lihat Keputusan Keseluruhan <i class="fas fa-flag-checkered ml-2"></i>`;
             nextBtn.classList.replace('bg-school-blue', 'bg-school-gold');
        } else if (isLastQInTopic) {
             nextBtn.innerHTML = `Teruskan ke Bab Seterusnya <i class="fas fa-forward ml-2"></i>`;
        }
        
        nextBtn.classList.remove('hidden');
    };

    window.nextQuestion = () => {
        const topicData = QuizData[State.currentLevel][State.currentTopicIndex];
        
        // Cek adakah ini soalan terakhir dalam Bab semasa
        if (State.currentQIndex < topicData.length - 1) {
            State.currentQIndex++;
            renderGameplay();
        } else {
            // Cek adakah ini Bab Terakhir
            if (State.currentTopicIndex < State.topics.length - 1) {
                State.currentTopicIndex++;
                State.currentQIndex = 0; // Reset index soalan untuk bab baru
                State.topicScore = 0; // (Opsional: Jika mahu track markah per bab)
                renderTopicTransition();
            } else {
                // Semua Bab Selesai
                renderResult();
            }
        }
    };

    async function renderResult() {
        const totalQ = State.topics.length * 3; // 30 soalan
        const percentage = Math.round((State.score / totalQ) * 100);
        let feedbackMsg = '';
        let icon = '';
        let color = '';
        
        if (percentage >= 80) {
            feedbackMsg = "Hebat! Penguasaan yang amat cemerlang.";
            icon = "fa-trophy";
            color = "text-yellow-500";
        } else if (percentage >= 50) {
            feedbackMsg = "Bagus! Teruskan usaha anda untuk A+.";
            icon = "fa-star";
            color = "text-school-blue";
        } else {
            feedbackMsg = "Jangan putus asa! Buat ulang kaji dan cuba lagi.";
            icon = "fa-book-reader";
            color = "text-gray-500";
        }

        contentDiv.innerHTML = `
            <div class="w-full max-w-sm fade-in text-center flex flex-col items-center">
                <i class="fas ${icon} fa-4x ${color} mb-4"></i>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Tahniah!</h2>
                <p class="text-gray-600 mb-6">Anda telah menamatkan Level ${State.currentLevel}.</p>
                
                    <p class="text-sm text-gray-500 mb-1">Markah Keseluruhan (Merangkumi 10 Bab)</p>
                    <p class="text-5xl font-extrabold text-school-blue">${State.score}<span class="text-2xl text-gray-400">/${totalQ}</span></p>
                    <p class="text-lg font-bold ${percentage >= 50 ? 'text-green-500' : 'text-red-500'} mt-2">${percentage}%</p>
                    <p class="mt-3 font-medium text-gray-700">${feedbackMsg}</p>
                </div>
                
                <div id="save-status" class="text-sm text-school-blue mb-4 font-semibold flex items-center gap-2">
                    <i class="fas fa-circle-notch fa-spin"></i> Sedang menghantar markah kepada guru...
                </div>

                <div class="w-full space-y-3">
                    <button onclick="window.shareWhatsApp()" class="w-full bg-green-500 text-white p-3 rounded-lg font-bold hover:bg-green-600 transition flex items-center justify-center gap-2 shadow-sm">
                        <i class="fab fa-whatsapp"></i> Maklumkan Guru via WhatsApp
                    </button>
                    <button onclick="window.appNav('level-select')" class="w-full bg-white border-2 border-school-blue text-school-blue p-3 rounded-lg font-bold hover:bg-blue-50 transition shadow-sm">
                        Pilih Level Lain
                    </button>
                </div>
            </div>
        `;

        // Simpan markah ke Firestore
        await submitScoreToCloud();
    }

    async function submitScoreToCloud() {
        const statusDiv = document.getElementById('save-status');
        if (!isFirebaseReady || !auth.currentUser) {
            statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle text-yellow-500"></i> Disimpan secara lokal (Tiada sambungan DB)`;
            statusDiv.className = "text-sm text-yellow-600 mb-4 font-semibold flex items-center justify-center gap-2";
            return;
        }

        try {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'math_scores'), {
                studentName: State.student.name,
                className: State.student.className,
                teacherEmail: State.student.teacherEmail,
                level: State.currentLevel,
                score: State.score,
                timestamp: new Date().toISOString()
            });
            statusDiv.innerHTML = `<i class="fas fa-check-circle text-green-500"></i> Markah berjaya dihantar kepada guru.`;
            statusDiv.className = "text-sm text-green-600 mb-4 font-semibold flex items-center justify-center gap-2";
        } catch (error) {
            console.error("Save score error:", error);
            statusDiv.innerHTML = `<i class="fas fa-times-circle text-red-500"></i> Gagal menghantar markah.`;
            statusDiv.className = "text-sm text-red-600 mb-4 font-semibold flex items-center justify-center gap-2";
        }
    }

    window.shareWhatsApp = () => {
        const totalQ = State.topics.length * 3;
        const percentage = Math.round((State.score / totalQ) * 100);
        const msg = `Salam Cikgu. Saya ${State.student.name} dari kelas ${State.student.className}. Saya telah selesai menjawab Kuiz Ulangkaji Matematik Tingkatan 4 (Level ${State.currentLevel}) merangkumi 10 bab. Markah saya: ${State.score}/${totalQ} (${percentage}%). Terima kasih!`;
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');
    };

    // Navigation Router
    window.appNav = (viewStr) => {
        State.view = viewStr;
        switch(viewStr) {
            case 'role-select': renderRoleSelect(); break;
            case 'teacher-login': renderTeacherLogin(); break;
            case 'student-login': renderStudentLogin(); break;
            case 'level-select': renderLevelSelect(); break;
            // 'game', 'result', 'teacher-dash' ditangani oleh fungsi spesifik
        }
    };

    // Mula Aplikasi
    window.onload = () => {
        initAuth();
    };

</script>
</body>
</html>
